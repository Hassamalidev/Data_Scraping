[project]
name = "mbd"
version = "0.1.0"
description = "Scraper/ETL worker for the Canadian Halal & Muslim-Owned Business Directory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    "selectolax>=0.3.21",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.scripts]
mbd = "mbd.cli:app"

[dependency-groups]
dev = [
    "black>=24.4",
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]
