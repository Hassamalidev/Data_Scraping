name: mbd

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mbd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbd}
      POSTGRES_DB: ${POSTGRES_DB:-mbd}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbd} -d ${POSTGRES_DB:-mbd}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration tool: `docker compose run --rm dbmate up`
  dbmate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mbd}:${POSTGRES_PASSWORD:-mbd}@db:5432/${POSTGRES_DB:-mbd}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db

  worker:
    build: ./scraper
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mbd}:${POSTGRES_PASSWORD:-mbd}@db:5432/${POSTGRES_DB:-mbd}
      DATABASE_URL_DIRECT: postgres://${POSTGRES_USER:-mbd}:${POSTGRES_PASSWORD:-mbd}@db:5432/${POSTGRES_DB:-mbd}
    volumes:
      - ./data/raw:/app/data/raw
      - ./exports:/app/exports
    command: ["mbd", "worker"]

  web:
    build: ./web
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mbd}:${POSTGRES_PASSWORD:-mbd}@db:5432/${POSTGRES_DB:-mbd}
      DATABASE_URL_DIRECT: postgres://${POSTGRES_USER:-mbd}:${POSTGRES_PASSWORD:-mbd}@db:5432/${POSTGRES_DB:-mbd}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
